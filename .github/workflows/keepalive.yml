name: Keep HF Space alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake space
        # Never fail the run — the space may just be waking up.
        run: curl -fsSL --max-time 90 "${{ vars.HF_SPACE_URL }}/api/health" || exit 0
