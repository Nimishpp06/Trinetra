<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Assistant — Trinetra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/style.css"/>
  <script src="assets/config.js"></script>
</head>
<body data-page="assistant">
  <main class="main">
    <div class="container-inner">

      <div class="page-head">
        <div>
          <h1>AI Health Assistant</h1>
          <p>Ask about air quality and receive health guidance. Supports text and voice input.</p>
        </div>
        <span class="chip-timestamp">— Gemini ready when data flows</span>
      </div>

      <div class="card chat-shell" style="border:none">
        <div class="chat-thread" id="chat-thread" aria-live="polite">
          <div class="msg msg-bot">
            <span class="avatar">AI</span>
            <div class="bubble">
              <span class="role">Trinetra Assistant</span>
              Ask me anything about air quality — in English, Hindi or Marathi. I'll
              answer based on live readings once the sensor network is connected.
            </div>
          </div>
        </div>

        <div class="lang-chips" aria-label="Supported languages">
          <button type="button" class="chip active">English</button>
          <button type="button" class="chip">हिन्दी</button>
          <button type="button" class="chip">मराठी</button>
        </div>

        <div class="chat-input-row">
          <div class="input-wrap">
            <input id="chat-input" type="text" placeholder="Type your question…" aria-label="Message" disabled/>
          </div>
          <button class="icon-btn mic" disabled aria-label="Voice input" title="Voice input">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg>
          </button>
          <button class="icon-btn send" disabled aria-label="Send" title="Send">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
          </button>
        </div>
      </div>

    </div>
  </main>

  <script src="assets/supabase.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
